[package]
name = "burn-rmvpe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The RMVPE pitch-estimation network in Burn"

[features]
# Extra compute backends for the *examples* (the weight-coverage harness that
# stands in for unit tests) and for whatever engine crate consumes this. Off by
# default, so the crate's normal build stays backend-free — nothing in `src/`
# names a backend, and keeping that mechanical is what protects checkpoint
# compatibility.
cuda = ["burn/cuda"]
tch = ["burn/tch"]
wgpu = ["burn/wgpu"]

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std"] }
burn-store.workspace = true
# Checkpoint loading, shared with every other network crate.
burn-kit = { workspace = true, features = ["store"] }

[dev-dependencies]
burn-ndarray = "0.21"
