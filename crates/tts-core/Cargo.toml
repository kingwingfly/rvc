[package]
name = "tts-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Speech synthesis (GPT-SoVITS) for the voice toolkit"

[features]
default = ["onnx"]
# The prosody encoder. On by default: it is the only implementation, and Chinese
# synthesis without prosody features is measurably flatter.
onnx = ["dep:ort", "dep:tokenizers"]
cuda = ["burn-kit/cuda"]
tch = ["burn-kit/tch"]
wgpu = ["burn-kit/wgpu"]

[dependencies]
text-kit.workspace = true
burn-gptsovits.workspace = true
burn-vits.workspace = true
burn = { workspace = true }
hub-kit.workspace = true
# `store` for `ApplyResult`: `burn-gptsovits` enables it too, but relying on
# another crate's feature to make this one compile is unification by luck.
burn-kit = { workspace = true, features = ["store"] }
# The prosody encoder is inference-only and published as ONNX, so it runs on
# ONNX Runtime rather than being ported. See `bert.rs`.
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
