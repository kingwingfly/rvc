[package]
name = "text-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Grapheme-to-phoneme for the voice toolkit's TTS: pure Rust, no model"

[dependencies]
# Chinese word segmentation — needed for tone sandhi, which is word-scoped, and
# to give the phrase dictionary words to look up.
jieba-rs = "0.10"
# Per-character Mandarin readings: the fallback for what no phrase covers. The
# phrase table is data, under `data/phrases.txt`.
pinyin = "0.11"
thiserror.workspace = true
