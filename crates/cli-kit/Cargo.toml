[package]
name = "cli-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI plumbing shared by the voice toolkit's binaries: logging, completions, device parsing"

[dependencies]
burn-kit.workspace = true
# For `DownloadOpts`, exactly as `burn-kit` is here for `parse_device`: the flag
# is parsed once for every binary and the type it produces belongs to the kit
# that owns the thing being configured. The edge only goes this way — `hub-kit`
# must not depend on `cli-kit`, which is why `WeightFormat` lives over there.
hub-kit.workspace = true
# For `DenoiseOpts`, and the same edge again: `audio-kit` owns the de-hiss
# stage these flags configure, and knows nothing about clap.
audio-kit.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true
# For the Ctrl-C early-stop flag; every binary here already runs on tokio.
tokio = { workspace = true }
