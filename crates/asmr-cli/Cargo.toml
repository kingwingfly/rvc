[package]
name = "asmr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "asmr — CLI for RVC voice conversion"

[[bin]]
name = "asmr"
path = "src/main.rs"

[dependencies]
asmr-audio.workspace = true
asmr-hub.workspace = true
# `burn` feature brings in the native Burn generator backend (BurnGenerator).
asmr-vc = { workspace = true, features = ["burn"] }
asmr-train.workspace = true
tokio = { workspace = true }
futures.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
