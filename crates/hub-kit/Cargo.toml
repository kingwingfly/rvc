[package]
name = "hub-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Auto-download and cache every engine's model assets"

[dependencies]
hf-hub.workspace = true
# Only for `fetch_naist_jdic`: a GitHub release asset is a plain URL and a
# gzipped tar, neither of which `hf-hub` can describe or unpack.
reqwest.workspace = true
flate2.workspace = true
tar.workspace = true
# `time` for the stall watchdog's clock — named here rather than relied on from
# the workspace set, because feature unification would supply it today (hf-hub
# and reqwest both want it) and the failure if that ever stopped being true is a
# compile error in a crate nobody was editing.
tokio = { workspace = true, features = ["time"] }
thiserror.workspace = true
tracing.workspace = true
