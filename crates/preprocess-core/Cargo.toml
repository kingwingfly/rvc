[package]
name = "preprocess-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "corpus preparation stages: slice on silence, de-hiss, separate voice from music, keep one speaker"

[features]
# One compute backend each, and they compose — a binary can carry all three and
# choose at run time. No `default`: a consumer that only wants the stages and
# their types should not drag in a GPU toolchain, and everything but the two
# loaders builds without one. There is no `onnx`, and that is a property of
# **both** models rather than an omission: MDX23C is published as a PyTorch
# checkpoint only, and nothing in this workspace exports CAM++.
#
# `burn-campplus` has no arm beside `burn-mdx`, and that is also not an omission:
# that crate deliberately declares no backend features, because those exist to
# give a crate's own *examples* a backend and its harness lives here.
cuda = ["burn/cuda", "burn-kit/cuda", "burn-mdx/cuda"]
tch = ["burn/tch", "burn-kit/tch", "burn-mdx/tch"]
wgpu = ["burn/wgpu", "burn-kit/wgpu", "burn-mdx/wgpu"]

[dependencies]
audio-kit.workspace = true
burn = { version = "0.21", default-features = false, features = ["std"] }
burn-mdx.workspace = true
# The speaker embedding `diarize` compares clips by.
burn-campplus.workspace = true
# `store` for the loaders' `ApplyResult`: a coverage report is what stands
# between a renamed tensor and a model running on freshly-initialised weights,
# which sounds like a bad recording rather than like a bug.
burn-kit = { workspace = true, features = ["store"] }
# For `Backend` alone — the one `--backend` enum the workspace shares. See
# `backend`'s module docs for why a `*-core` naming it is the sanctioned half of
# that trade.
cli-kit.workspace = true
anyhow.workspace = true
futures.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
# `examples/timbre` parses `--backend` through `cli_kit::Backend`'s own
# `ValueEnum`, so its aliases cannot drift from the binaries'.
clap.workspace = true
