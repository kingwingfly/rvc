[package]
name = "burn-seedvc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Seed-VC network in Burn: CAMPPlus timbre, the U-ViT diffusion transformer, flow matching and BigVGAN"

[features]
# Extra compute backends for the examples (the weight-coverage harnesses that
# stand in for unit tests) and for whatever the engine crate is built with. Off
# by default so the crate's normal build stays backend-free.
#
# All three, matching every other `*-core`/`*-cli` in the workspace: this crate
# carried only `cuda` and `tch` while it had no consumer, which would have made
# `seedvc --backend wgpu` quietly impossible.
cuda = ["burn/cuda"]
tch = ["burn/tch"]
wgpu = ["burn/wgpu"]

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std"] }
burn-vits.workspace = true
# CAMPPlus and its Kaldi filterbank, re-exported so no call site moved.
burn-campplus.workspace = true
burn-whisper.workspace = true
burn-store.workspace = true
burn-kit = { workspace = true, features = ["store"] }

[dev-dependencies]
burn-ndarray = "0.21"
