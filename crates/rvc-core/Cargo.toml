[package]
name = "rvc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "RVC v2 voice-conversion inference (ort/ONNX) as a streaming Converter"

[features]
# The native Burn generator backend (`.pth`/`.safetensors`), a peer to the
# default ONNX-Runtime path. Off by default so `rvc-core` stays a lean ort crate
# for consumers (e.g. `rvc-train`) that only need the shared `FeatureExtractor`.
#
# `burn` alone gives the *generic* `BurnGenerator<B>` and no concrete compute
# backend — deliberate, so a consumer picks what it links. `cuda`/`tch` each add
# one, and both can be on at once: `--backend` then chooses at runtime.
#
# It also brings in the Burn ContentVec and RMVPE (`burn_features.rs`). The two
# halves are one feature rather than three because they are one decision: a
# build that wants Burn inference wants all of it, and `--backend`,
# `--content-vec-backend` and `--rmvpe-backend` are run-time choices over what
# is linked, never build-time ones.
burn = ["dep:burn", "dep:burn-rvc", "dep:burn-rmvpe"]
# CubeCL/CUDA compute backend for the Burn generator.
cuda = ["burn", "burn/cuda", "burn-kit/cuda"]
# LibTorch compute backend. Needs a LibTorch install at build time — see
# `build.rs`, which refuses to let `torch-sys` silently download a CPU-only one.
tch = ["burn", "burn/tch", "dep:tch", "burn-kit/tch"]
# WebGPU compute backend (wgpu → Vulkan/Metal/DX12). Pure Rust: unlike `cuda` and
# `tch` it needs no vendor toolkit or external library, so it is the portable
# fallback — and the only Burn backend that runs on AMD/Intel/Apple GPUs.
wgpu = ["burn", "burn/wgpu", "burn-kit/wgpu"]

# The cross-runtime F0 check. `required-features` rather than a `#[cfg]` inside
# it: an example that silently compiles to nothing when the backend it exists to
# exercise is absent is an example nobody notices has stopped running.
[[example]]
name = "f0_runtimes"
required-features = ["tch"]

[dependencies]
audio-kit.workspace = true
# Device selection: shared with every engine so `auto` cannot mean two things.
burn-kit.workspace = true
tokio.workspace = true
futures.workspace = true
async-stream.workspace = true
ort.workspace = true
ndarray.workspace = true
rustfft.workspace = true
thiserror.workspace = true
tracing.workspace = true
burn = { workspace = true, optional = true }
burn-rvc = { workspace = true, optional = true }
burn-rmvpe = { workspace = true, optional = true }
tch = { workspace = true, optional = true }
