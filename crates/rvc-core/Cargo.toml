[package]
name = "rvc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "RVC v2 voice-conversion inference (ort/ONNX) as a streaming Converter"

[features]
# The native Burn generator backend (`.pth`/`.safetensors`), a peer to the
# default ONNX-Runtime path. Off by default so `rvc-core` stays a lean ort crate
# for consumers (e.g. `rvc-train`) that only need the shared `FeatureExtractor`.
burn = ["dep:burn", "dep:burn-rvc"]

[dependencies]
rvc-audio.workspace = true
tokio.workspace = true
futures.workspace = true
async-stream.workspace = true
ort.workspace = true
ndarray.workspace = true
rustfft.workspace = true
thiserror.workspace = true
tracing.workspace = true
burn = { workspace = true, features = ["cuda"], optional = true }
burn-rvc = { workspace = true, optional = true }
