[package]
name = "burn-campplus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The CAM++ speaker-embedding network in Burn, with the Kaldi filterbank it is the only consumer of"

# No `cuda`/`tch`/`wgpu` features, unlike most sibling `burn-*` crates and for
# `burn-hubert`'s reason: those exist to give a crate's *examples* a compute
# backend, and this network's coverage harnesses stay `burn-seedvc`'s
# `examples/load` and `examples/speaker` plus `seedvc-core`'s `examples/coverage`.
# Gaining an example of its own is what would earn them back.

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std"] }
burn-store.workspace = true
# Checkpoint loading, shared with every other network crate.
burn-kit = { workspace = true, features = ["store"] }

[dev-dependencies]
burn-ndarray = "0.21"
