[package]
name = "rvc-train"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native (Rust) RVC generator training for the rvc toolkit"

[features]
# Compute backends for the training loop, mirroring `rvc-core`'s. `trainer::run`
# is generic over `AutodiffBackend`, so these only decide what gets linked;
# `TrainRequest::backend` picks among them at runtime.
cuda = ["burn/cuda", "rvc-core/cuda", "burn-kit/cuda"]
tch = ["burn/tch", "rvc-core/tch", "burn-kit/tch"]
wgpu = ["burn/wgpu", "rvc-core/wgpu", "burn-kit/wgpu"]

[dependencies]
audio-kit.workspace = true
rvc-core.workspace = true
burn-rvc.workspace = true
# `store` for `check_coverage` on the four warm-start/resume loads: declared
# rather than inherited from `burn-rvc`, so this crate does not compile only by
# a sibling's grace.
burn-kit = { workspace = true, features = ["store"] }
burn-vits.workspace = true
train-kit.workspace = true
tokio = { workspace = true }
futures.workspace = true
anyhow.workspace = true
tracing.workspace = true
# `metrics` enables burn-train's sys-metrics (CPU via sysinfo, GPU via NVML) for
# the dashboard's CPU/GPU usage lines.
burn = { workspace = true, features = ["autodiff", "train", "tui", "metrics"] }

[dev-dependencies]
# CPU backend so the data-parallel plumbing can be tested without a GPU.
burn-ndarray = "0.21"
