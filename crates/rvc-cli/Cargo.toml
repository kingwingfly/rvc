[package]
name = "rvc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "rvc — CLI for RVC voice conversion"

[[bin]]
name = "rvc"
path = "src/main.rs"

[features]
# One binary, both Burn compute backends linked; `--backend` picks at runtime.
# Machines without a LibTorch install build with
# `--no-default-features --features cuda` (then `--backend tch` errors cleanly).
# `wgpu` is deliberately NOT default: its compute and gradients are correct, but
# the process aborts (heap corruption) at exit whenever ONNX Runtime is loaded
# too — which `convert`/`train` always do, for ContentVec + RMVPE. Opt in with
# `--features wgpu` to experiment.
default = ["cuda", "tch"]
cuda = ["rvc-core/cuda", "rvc-train/cuda"]
tch = ["rvc-core/tch", "rvc-train/tch"]
wgpu = ["rvc-core/wgpu", "rvc-train/wgpu"]

[dependencies]
rvc-audio.workspace = true
rvc-hub.workspace = true
# `burn` feature brings in the native Burn generator backend (BurnGenerator).
rvc-core = { workspace = true, features = ["burn"] }
rvc-train.workspace = true
tokio = { workspace = true }
futures.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
