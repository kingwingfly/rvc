[package]
name = "rvc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "rvc — CLI for RVC voice conversion"

# A library as well as a binary: the `voice` tool hosts these same subcommands
# under `voice rvc …`, and does it by depending on this crate rather than by
# copying a single argument definition.
[lib]
name = "rvc_cli"
path = "src/lib.rs"

[[bin]]
name = "rvc"
path = "src/main.rs"

[features]
# One binary, both Burn compute backends linked; `--backend` picks at runtime.
# Machines without a LibTorch install build with
# `--no-default-features --features cuda` (then `--backend tch` errors cleanly).
# One binary, every compute backend; `--backend` picks at run time.
default = ["cuda", "tch", "wgpu"]
cuda = ["rvc-core/cuda", "rvc-train/cuda", "burn-kit/cuda"]
tch = ["rvc-core/tch", "rvc-train/tch", "burn-kit/tch"]
wgpu = ["rvc-core/wgpu", "rvc-train/wgpu", "burn-kit/wgpu"]

[dependencies]
audio-kit.workspace = true
burn-kit.workspace = true
cli-kit.workspace = true
hub-kit.workspace = true
# `burn` feature brings in the native Burn generator backend (BurnGenerator).
rvc-core = { workspace = true, features = ["burn"] }
rvc-train.workspace = true
train-kit.workspace = true
tokio = { workspace = true }
futures.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
