[package]
name = "train-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Training scaffolding with no model knowledge: checkpoints, EMA, gradient accumulation, dashboard"

[dependencies]
# `metrics` enables burn-train's sys-metrics (CPU via sysinfo, GPU via NVML) for
# the dashboard's usage lines.
burn = { workspace = true, features = ["autodiff", "train", "tui", "metrics"] }
burn-store.workspace = true
burn-kit = { workspace = true, features = ["store"] }
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
burn-ndarray = "0.21"
