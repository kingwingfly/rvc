[package]
name = "burn-rvc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "RVC v2 (Retrieval-based Voice Conversion) neural network in Burn"

[features]
# Extra compute backends for the *examples* (the weight-coverage harness that
# stands in for unit tests). Off by default, so the crate's normal build stays
# backend-free — nothing in `src/` names a backend, and keeping that mechanical
# is what protects warm-start compatibility and the ONNX exporter.
cuda = ["burn/cuda"]
tch = ["burn/tch"]

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std"] }
burn-vits.workspace = true
# ContentVec is a HuBERT checkpoint, and the architecture is shared with
# GPT-SoVITS's cnhubert — so `contentvec.rs` wraps that crate rather than
# restating the network here.
burn-hubert.workspace = true
burn-store.workspace = true
# Checkpoint loading lives in `burn-kit`, shared with every other network crate.
burn-kit = { workspace = true, features = ["store"] }

[dev-dependencies]
burn-ndarray = "0.21"
