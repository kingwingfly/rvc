[package]
name = "tts-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "tts — speech synthesis CLI, a Unix filter over GPT-SoVITS"

# A library as well as a binary, so `voice` hosts `voice tts` from this code
# rather than a copy of every flag.
[lib]
name = "tts_cli"
path = "src/lib.rs"

[[bin]]
name = "tts"
path = "src/main.rs"

[features]
default = ["cuda", "tch", "wgpu", "onnx"]
cuda = ["tts-core/cuda", "tts-train/cuda", "burn/cuda"]
tch = ["tts-core/tch", "tts-train/tch", "burn/tch"]
wgpu = ["tts-core/wgpu", "tts-train/wgpu", "burn/wgpu"]
onnx = ["tts-core/onnx", "tts-train/onnx"]

[dependencies]
tts-core.workspace = true
tts-train.workspace = true
train-kit.workspace = true
text-kit.workspace = true
audio-kit.workspace = true
hub-kit.workspace = true
cli-kit.workspace = true
burn-kit.workspace = true
burn = { workspace = true }
tokio = { workspace = true }
futures.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true

[build-dependencies]
rpath-kit.workspace = true
