[package]
name = "voice-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "voice — speech toolkit CLI: recognition, synthesis and voice conversion"

[[bin]]
name = "voice"
path = "src/main.rs"

# Forwarded verbatim to each engine's own `*-cli`, which owns its backend
# wiring. Keeping the feature names identical means one documented escape hatch
# works for every binary: `--no-default-features --features cuda` on a machine
# with no LibTorch install.
[features]
default = ["cuda", "tch", "wgpu", "onnx"]
cuda = ["rvc-cli/cuda", "stt-cli/cuda", "tts-cli/cuda", "seedvc-cli/cuda"]
tch = ["rvc-cli/tch", "stt-cli/tch", "tts-cli/tch", "seedvc-cli/tch"]
wgpu = ["rvc-cli/wgpu", "stt-cli/wgpu", "tts-cli/wgpu", "seedvc-cli/wgpu"]
# Each engine with an ONNX path forwards it; Seed-VC's joined now that
# `export/export_seedvc.py` writes the six graphs `--onnx` runs.
onnx = ["stt-cli/onnx", "tts-cli/onnx", "seedvc-cli/onnx"]

[dependencies]
rvc-cli.workspace = true
stt-cli.workspace = true
tts-cli.workspace = true
seedvc-cli.workspace = true
preprocess-cli.workspace = true
cli-kit.workspace = true
tokio = { workspace = true }
clap.workspace = true
anyhow.workspace = true

[build-dependencies]
rpath-kit.workspace = true
