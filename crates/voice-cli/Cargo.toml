[package]
name = "voice-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "voice — speech toolkit CLI: recognition, synthesis and voice conversion"

[[bin]]
name = "voice"
path = "src/main.rs"

# Forwarded verbatim to `rvc-cli`, which owns the backend wiring. Keeping the
# feature names identical means one documented escape hatch works for both
# binaries: `--no-default-features --features cuda` on a machine with no
# LibTorch install.
[features]
default = ["cuda", "tch", "wgpu", "onnx"]
cuda = ["rvc-cli/cuda", "stt-cli/cuda", "tts-cli/cuda"]
tch = ["rvc-cli/tch", "stt-cli/tch", "tts-cli/tch"]
wgpu = ["rvc-cli/wgpu", "stt-cli/wgpu", "tts-cli/wgpu"]
onnx = ["stt-cli/onnx", "tts-cli/onnx"]

[dependencies]
rvc-cli.workspace = true
stt-cli.workspace = true
tts-cli.workspace = true
cli-kit.workspace = true
tokio = { workspace = true }
clap.workspace = true
anyhow.workspace = true

[build-dependencies]
rpath-kit.workspace = true
