[workspace]
resolver = "3"
members = [
    "crates/burn-kit",
    "crates/audio-kit",
    "crates/hub-kit",
    "crates/stt-core",
    "crates/cli-kit",
    "crates/preprocess-kit",
    "crates/stt-cli",
    "crates/tts-core",
    "crates/tts-train",
    "crates/tts-cli",
    "crates/rvc-core",
    "crates/burn-rvc",
    "crates/burn-vits",
    "crates/burn-gptsovits",
    "crates/burn-whisper",
    "crates/burn-seedvc",
    "crates/text-kit",
    "crates/train-kit",
    "crates/rpath-kit",
    "crates/rvc-train",
    "crates/rvc-cli",
    "crates/voice-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# GPL-3.0 because `burn-seedvc` is a port of Seed-VC, which is GPL-3.0, and a
# derivative work carries the licence forward to everything that links it.
# `-only` rather than `-or-later`: upstream ships the bare GPL-3.0 text with no
# "or any later version" statement, and -only is the reading that is valid
# either way.
license = "GPL-3.0-only"
repository = "https://github.com/kingwingfly/asmr"
rust-version = "1.85"

[workspace.dependencies]
# Local crates
# Named `voice-*`, not `rvc-*`: three engines share these, and an engine must
# never appear to depend on another engine.
audio-kit = { path = "crates/audio-kit" }
hub-kit = { path = "crates/hub-kit" }
rvc-core = { path = "crates/rvc-core" }
rvc-train = { path = "crates/rvc-train" }
# No default features: `voice-cli` re-declares the same backend feature names and
# forwards them, so one `--no-default-features --features cuda` works for both
# binaries. (Cargo forbids a member overriding an inherited `default-features`.)
rvc-cli = { path = "crates/rvc-cli", default-features = false }
burn-rvc = { path = "crates/burn-rvc" }
burn-kit = { path = "crates/burn-kit" }
burn-vits = { path = "crates/burn-vits" }
burn-gptsovits = { path = "crates/burn-gptsovits" }
burn-whisper = { path = "crates/burn-whisper" }
burn-seedvc = { path = "crates/burn-seedvc" }
stt-core = { path = "crates/stt-core" }
cli-kit = { path = "crates/cli-kit" }
preprocess-kit = { path = "crates/preprocess-kit" }
train-kit = { path = "crates/train-kit" }
# A build-dependency, not a runtime one: it only prints link arguments.
rpath-kit = { path = "crates/rpath-kit" }
text-kit = { path = "crates/text-kit" }
tts-core = { path = "crates/tts-core" }
tts-train = { path = "crates/tts-train" }
tts-cli = { path = "crates/tts-cli", default-features = false }
# Same reason as `rvc-cli`: `voice-cli` re-declares the backend features and
# forwards them, and cargo forbids overriding an inherited `default-features`.
stt-cli = { path = "crates/stt-cli", default-features = false }
burn = { version = "0.21", default-features = false, features = ["std", "ndarray"] }
# Checkpoint readers. `burn-kit` owns the loading helpers; `burn-rvc` and every
# later network crate go through it rather than depending on this directly.
burn-store = { version = "0.21", default-features = false, features = ["std", "pytorch", "safetensors"] }
# Only for capability probes `burn-tch` does not re-export (`Cuda::device_count`,
# `utils::has_mps/has_vulkan`) — `LibTorch::device_count()` is hardcoded to 1.
# Same library burn-tch already links, so this costs no extra build.
tch = { version = "0.22", default-features = false }

# Async / streaming
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "fs", "signal"] }
futures = "0.3"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# Signal processing (mel frontend for RMVPE)
rustfft = "6"

# Inference
# load-dynamic: dlopen onnxruntime at runtime via ORT_DYLIB_PATH (never bundled).
# api-24 matches the ONNX Runtime 1.24 API rc.13 targets; cuda EP registered at runtime.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "load-dynamic",
    "std",
    "ndarray",
    "tracing",
    "api-24",
    "cuda",
] }
ndarray = "0.17"

# Audio (ffmpeg 8.1)
ffmpeg-next = "8.1"

# Model download (async API is the default in 1.0; `blocking` is opt-in)
hf-hub = { version = "1.0", features = ["rustls-tls"] }

# Text
# BPE vocabularies straight from a Hugging Face `tokenizer.json`.
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
serde_json = "1"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"

# Error handling / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# A debug build has to be able to actually run a model, or every check turns into
# a release build and a release build of this workspace is minutes of `lto`.
# Dependencies carry all the tensor math (burn, ndarray, tch, rustfft, ffmpeg) and
# they change almost never, so optimise them fully and cache that. Our own crates
# stay at `opt-level = 1`: still quick to compile, but not the 10-100x penalty
# that unoptimised Rust numeric loops pay.
#
# Changing either line invalidates the whole cache — expect one slow rebuild.
[profile.dev]
opt-level = 1
# Full debuginfo makes each binary ~1 GB, and linking that dominates every
# incremental rebuild. Line tables keep panic backtraces useful — which is what
# this workspace actually debugs with — at a fraction of the size.
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
# Dependencies are not what anyone here steps through, and they are most of the
# debuginfo.
debug = false
