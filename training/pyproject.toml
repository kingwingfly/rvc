[project]
name = "asmr-train"
version = "0.1.0"
description = "RVC training + ONNX export pipeline for the ASMR voice toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "onnx>=1.16",
    "soundfile>=0.12",
    "librosa>=0.10",
]

# The RVC training code (SynthesizerTrnMs768NSFsid, preprocess/extract scripts)
# is provided out-of-band. Point RVC_REPO at a checkout of
# https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI
# (see README). It is intentionally not a hard dependency so `uv sync` stays light.

[project.scripts]
asmr-train = "asmr_train.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asmr_train", "src/asmr_tts"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
files = ["src"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
