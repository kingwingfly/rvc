[project]
name = "rvc-onnx-export"
version = "0.1.0"
description = "Convert a Burn-trained RVC/GPTSoVITS (safetensors) to ONNX for deploy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
    "safetensors>=0.4",
    "onnx>=1.16",
    "onnxscript>=0.7",
]

[tool.uv]
package = false
