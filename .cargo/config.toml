# Let every binary this workspace builds — tests and examples included, not just
# `rvc` — find LibTorch without LD_LIBRARY_PATH.
#
# `crates/rvc-cli/build.rs` bakes the absolute `$LIBTORCH/lib` into the `rvc`
# binary, but `rustc-link-arg-bins` only reaches that one package; feature
# unification links LibTorch into every crate's test binary too. These paths are
# relative, so they are machine-independent and safe to commit: a bare relative
# rpath is resolved against the working directory, which for `cargo test` and
# `cargo run` is the workspace root — where `./libtorch` lives.
#
# Two depths because cargo picks the working directory per target: the workspace
# root for `cargo run`, the *package* root (`crates/<name>`) for tests.
#
# Note: a `RUSTFLAGS` environment variable *replaces* this rather than adding to
# it, so export `LD_LIBRARY_PATH=$LIBTORCH/lib` if you need to set RUSTFLAGS.
[build]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,libtorch/lib",
    "-C", "link-arg=-Wl,-rpath,../../libtorch/lib",
]
